name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B package
      - run: gh release create v${{ github.run_number }} target/SaddleSeat.jar --title "build ${{ github.run_number }}" --notes "SaddleSeat"
        env:
          GH_TOKEN: ${{ github.token }}
          
